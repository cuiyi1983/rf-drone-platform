name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  system-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pytest requests scipy numpy pillow

      - name: Run system tests
        run: |
          python -m pytest tests/system/ -v --tb=short
