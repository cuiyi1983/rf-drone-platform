name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  system-tests:
    runs-on: yoyo-server
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install uv
          uv venv .venv --python 3.10
          source .venv/bin/activate
          uv pip install -e ".[dev]"
          uv pip install requests scipy playwright onnxruntime

      - name: Install Playwright Chromium
        run: |
          source .venv/bin/activate
          playwright install chromium --with-deps

      - name: Run system tests (API)
        run: |
          source .venv/bin/activate
          pytest tests/system/test_repeater_api.py tests/system/test_sim_inference_stats.py -v --tb=short --capture=no

      - name: Start frontend dev server
        run: |
          source .venv/bin/activate
          cd frontend && npm run dev &
          sleep 8

      - name: Run UI smoke tests
        run: |
          source .venv/bin/activate
          pytest tests/system/test_repeater_ui.py -v --tb=short
