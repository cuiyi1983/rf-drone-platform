name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  system-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COLLECTOR_DEVICE_IMPL: mock

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install uv
          uv venv .venv --python 3.10
          source .venv/bin/activate
          uv pip install -e ".[dev]"
          uv pip install requests scipy playwright

      - name: Install Playwright Chromium
        run: |
          source .venv/bin/activate
          playwright install chromium --with-deps

      - name: Run system tests (API)
        run: |
          source .venv/bin/activate
          pytest tests/system/test_repeater_api.py -v --tb=short --capture=no

      - name: Run UI smoke tests
        run: |
          source .venv/bin/activate
          pytest tests/system/test_repeater_ui.py -v --tb=short
